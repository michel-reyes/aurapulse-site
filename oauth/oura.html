<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Returning to AuraPulse</title>
  <script>
    // Backup redirect for the Oura sign-in: hands the result straight back to the AuraPulse app.
    // The access token travels in the URL fragment (#...), which browsers never send to this web server.
    location.replace('com.michelreyes.aurapulse:/oauth/oura' + location.search + location.hash);
  </script>
</head>
<body style="font-family:-apple-system,sans-serif;padding:24px">
  Returning to AuraPulse…
</body>
</html>
